<style>
:root{--bg:#f4f2ee;--card:#ffffff;--soft:#efece6;--tx:#1f1e1c;--tx2:#5f5e5a;--bd:#d9d6cf;--acc:#185fa5;--ok:#3b6d11;--bad:#a32d2d;--warn:#854f0b;color-scheme:light}

*{box-sizing:border-box}

table{border-collapse:collapse;font-size:12px}td{border:1px solid var(--bd);padding:4px 10px;text-align:center}

@media (max-width:680px){.g2,.split{grid-template-columns:1fr}.split>div:first-child{border-right:none;border-bottom:1px solid var(--bd)}.cl4{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
@media (max-aspect-ratio:4/3){.title-scene::before{background-size:auto 100%}.title-interview{width:72%;top:12%}.title-dungeon{width:58%;top:22%}.title-subtitle{width:70%;top:31%}.title-gate{width:52%;left:24%;top:38%}.title-floor{width:110%;left:-5%}.title-menu{top:59%;width:56%}}

<body>
<div class="wrap">
<p class="note"><span>Interview Dungeon · playable demo · Floor III of the Google SWE Intern path · progress is saved in this browser only</span><span><a href="https://github.com/renilsonjr/Interview-Dungeon">GitHub</a> · <a href="https://discord.gg/cfDFY9NZMj">Discord</a></span></p>
<div id="app"></div>
</div>
<script>
// ---------- storage ----------
const KEY = 'interview-dungeon-demo-v1';
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }
function fresh() { return { hero: null, steps: {}, notes: { gen: '', z: {}, f: {} }, edits: {}, bossSubs: 0, bossLost: false, practiceDone: false, history: [] }; }
let P = load() || fresh();
const S = { view: 'title', hist: [], cls: 0, floor: 'III', sub: 'steps', dsel: null, lang: 'en', chip: 0, qp: -1, qc: false, queue: [], step: null, boss: false, timer: null, deadline: 0, lvlUp: false };

function esc(x) { return String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function today() { return new Date().toISOString().slice(0, 10); }

// ---------- game data ----------
const CL = [['Warrior', '⚔\ufe0e'], ['Sorcerer', '✶'], ['Rogue', '◎'], ['Barbarian', '⚒\ufe0e']];
const Z = [
  ['The cathedral', 'Gates', [['I', 'Application and resume', 5], ['II', 'Coding foundations', 10]]],
  ['The catacombs', 'DSA basics', [['III', 'Arrays and strings', 3.75], ['IV', 'Hash maps and sets', 3.75], ['V', 'Two pointers, sliding window', 3.75], ['VI', 'Stacks and queues', 3.75], ['VII', 'Linked lists', 3.75], ['VIII', 'Binary search', 3.75]]],
  ['The caves', 'DSA advanced', [['IX', 'Recursion and backtracking', 3.75], ['X', 'Trees', 3.75], ['XI', 'Heaps', 3.75], ['XII', 'Graphs', 3.75], ['XIII', 'Intervals', 3.75], ['XIV', 'Dynamic programming', 3.75]]],
  ['The abyss', 'The interview itself', [['XV', 'Technical communication', 20], ['XVI', 'Online assessment', 10], ['XVII', 'Team match', 10], ['XVIII', 'The full loop', 0]]]
];
const FL = {}; Z.forEach(z => z[2].forEach(f => FL[f[0]] = f));
// Floor III run, shortened for the demo. Units: a normal step is 1, the boss is 4.
const RUN = [
  { id: 'learn', name: 'Learn: three array patterns', type: 'learn', u: 1 },
  { id: 'quiz', name: 'Recognize (quiz)', type: 'quiz', u: 1 },
  { id: 'e1', name: 'Easy 1 · Two loads', type: 'code', u: 1 },
  { id: 'e2', name: 'Easy 2 · Fuel prices', type: 'code', u: 1 },
  { id: 'm1', name: 'Medium 1 · Other belts total', type: 'code', u: 1 },
  { id: 'm2', name: 'Medium 2 · Best window', type: 'code', u: 1 },
  { id: 'boss', name: 'Boss · the Arrays guardian', type: 'boss', u: 4 }
];
const UNITS = RUN.reduce((a, s) => a + s.u, 0);
function readiness() { return RUN.reduce((a, s) => a + (P.steps[s.id] ? s.u : 0), 0) / UNITS * FL.III[2]; }
function floorCleared() { return !!P.steps.boss; }

// ---------- problems: original, inspired by common array patterns ----------
const PR = {
  e1: { title: 'Two loads', fn: 'pair_for_target', sig: 'def pair_for_target(weights, target):\n    ',
    story: 'A truck carries exactly <code>target</code> kilos. Given the package <code>weights</code>, return the positions <code>[i, j]</code> (with <code>i &lt; j</code>) of the two packages that add up to <code>target</code>. There is always exactly one answer.',
    cons: '2 ≤ len(weights) ≤ 10,000 · values between -10^9 and 10^9',
    ex: [{ a: [[2, 7, 11, 15], 9], e: [0, 1] }, { a: [[3, 2, 4], 6], e: [1, 2] }],
    hid: [{ a: [[3, 3], 6], e: [0, 1] }, { a: [[1, 5, 9, 14], 23], e: [2, 3] }, { a: [[-3, 4, 3, 90], 0], e: [0, 2] }, { a: [[0, 4, 3, 0], 0], e: [0, 3] }], cx: 'O(n)' },
  e2: { title: 'Fuel prices', fn: 'best_gain', sig: 'def best_gain(prices):\n    ',
    story: '<code>prices[i]</code> is the price of a fuel barrel on day <code>i</code>. You may buy once and sell once, later. Return the biggest gain you can make, or <code>0</code> if no gain is possible.',
    cons: '1 ≤ len(prices) ≤ 100,000 · 0 ≤ prices[i] ≤ 10,000',
    ex: [{ a: [[7, 1, 5, 3, 6, 4]], e: 5 }, { a: [[7, 6, 4, 3, 1]], e: 0 }],
    hid: [{ a: [[1]], e: 0 }, { a: [[2, 4, 1]], e: 2 }, { a: [[3, 3, 3]], e: 0 }, { a: [[1, 2, 3, 4, 5]], e: 4 }, { a: [[2, 1, 2, 1, 0, 1, 2]], e: 2 }], cx: 'O(n)' },
  m1: { title: 'Other belts total', fn: 'other_belts_total', sig: 'def other_belts_total(counts):\n    ',
    story: 'A sorting hub has <code>n</code> belts. <code>counts[i]</code> is how many packages belt <code>i</code> handled today. Return a list where position <code>i</code> holds the total of every belt <b>except</b> belt <code>i</code>. Try it without subtraction: one pass from the left, one from the right.',
    cons: '2 ≤ len(counts) ≤ 100,000 · 0 ≤ counts[i] ≤ 10,000',
    ex: [{ a: [[4, 1, 3]], e: [4, 7, 5] }, { a: [[5, 5]], e: [5, 5] }],
    hid: [{ a: [[0, 0]], e: [0, 0] }, { a: [[1, 2, 3, 4]], e: [9, 8, 7, 6] }, { a: [[10000, 0, 1]], e: [1, 10001, 10000] }], cx: 'O(n)' },
  m2: { title: 'Best window', fn: 'best_window', sig: 'def best_window(net):\n    ',
    story: '<code>net[i]</code> is the number of packages gained (or lost, if negative) in hour <code>i</code>. Return the largest total of any run of <b>consecutive</b> hours. The run must contain at least one hour.',
    cons: '1 ≤ len(net) ≤ 100,000 · -10,000 ≤ net[i] ≤ 10,000',
    ex: [{ a: [[-2, 1, -3, 4, -1, 2, 1, -5, 4]], e: 6 }, { a: [[1]], e: 1 }],
    hid: [{ a: [[-3, -1, -2]], e: -1 }, { a: [[5, 4, -1, 7, 8]], e: 23 }, { a: [[0, 0, 0]], e: 0 }, { a: [[-1, 3, -2, 3]], e: 4 }], cx: 'O(n)' },
  practice: { title: 'Empty slots last', fn: 'push_empty', sig: 'def push_empty(slots):\n    ',
    story: 'A shelf is a list where <code>0</code> means an empty slot. Return a list with every non-zero item in its original order, followed by all the zeros.',
    cons: '1 ≤ len(slots) ≤ 100,000',
    ex: [{ a: [[0, 1, 0, 3, 12]], e: [1, 3, 12, 0, 0] }, { a: [[0]], e: [0] }],
    hid: [{ a: [[1, 2, 3]], e: [1, 2, 3] }, { a: [[0, 0, 1]], e: [1, 0, 0] }, { a: [[4, 0, 5, 0, 0, 6]], e: [4, 5, 6, 0, 0, 0] }], cx: 'O(n)' },
  boss: { title: 'Rotate the belt', fn: 'rotate_belt', sig: 'def rotate_belt(items, k):\n    ',
    story: 'A circular belt moves <code>k</code> positions to the right. Return the new order of <code>items</code>: the last <code>k</code> items wrap around to the front. <code>k</code> can be larger than the number of items.',
    cons: '1 ≤ len(items) ≤ 100,000 · 0 ≤ k ≤ 10^9',
    ex: [{ a: [[1, 2, 3, 4, 5], 2], e: [4, 5, 1, 2, 3] }],
    hid: [{ a: [[1, 2, 3], 0], e: [1, 2, 3] }, { a: [[1, 2], 3], e: [2, 1] }, { a: [[7], 100], e: [7] }, { a: [[1, 2, 3, 4, 5, 6], 6], e: [1, 2, 3, 4, 5, 6] }, { a: [[-1, -100, 3, 99], 2], e: [3, 99, -1, -100] }], cx: 'O(n)' }
};
function fmtArgs(p, a) { const names = p.sig.match(/\((.*)\)/)[1].split(',').map(s => s.trim()); return names.map((n, i) => n + ' = ' + JSON.stringify(a[i])).join(', '); }

// ---------- Python in the browser: Pyodide in a Web Worker, so a slow solution can be stopped ----------
const PYODIDE = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/';
const HARNESS = `
import json, copy, sys, io
cases = json.loads(CASES_JSON)
buf = io.StringIO(); old = sys.stdout; sys.stdout = buf
res = {"compile_error": None, "cases": [], "stdout": ""}
ns = {}
try:
    exec(USER_CODE, ns)
except Exception as e:
    res["compile_error"] = type(e).__name__ + ": " + str(e)
if not res["compile_error"]:
    f = ns.get(FN)
    if not callable(f):
        res["compile_error"] = "Define a function named " + FN + "."
    else:
        for c in cases:
            try:
                got = f(*copy.deepcopy(c["args"]))
                res["cases"].append({"ok": got == c["expected"], "got": repr(got)})
            except Exception as e:
                res["cases"].append({"ok": False, "got": None, "error": type(e).__name__ + ": " + str(e)})
sys.stdout = old
res["stdout"] = buf.getvalue()[:2000]
json.dumps(res)
`;
const WORKER_SRC = `
importScripts('${PYODIDE}pyodide.js');
const ready = loadPyodide({ indexURL: '${PYODIDE}' });
ready.then(() => postMessage({ ready: true }), err => postMessage({ fatal: String(err) }));
onmessage = async (e) => {
  const py = await ready;
  py.globals.set('USER_CODE', e.data.code);
  py.globals.set('FN', e.data.fn);
  py.globals.set('CASES_JSON', JSON.stringify(e.data.cases));
  try { postMessage({ result: py.runPython(${JSON.stringify(HARNESS)}) }); }
  catch (err) { postMessage({ fatal: String(err) }); }
};`;
let worker = null, workerReady = null;
function makeWorker() {
  worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' })));
  workerReady = new Promise((res, rej) => { worker.onmessage = e => { if (e.data.ready) res(); else if (e.data.fatal) rej(new Error(e.data.fatal)); }; });
}
async function runPy(code, fn, cases) {
  if (!worker) makeWorker();
  try { await workerReady; } catch (e) { worker = null; return { fatal: 'Python could not load. Check your connection and try again.' }; }
  return new Promise(resolve => {
    const t = setTimeout(() => { worker.terminate(); worker = null; resolve({ timeout: true }); }, 8000);
    worker.onmessage = e => { if (e.data.ready) return; clearTimeout(t); resolve(e.data.result ? JSON.parse(e.data.result) : { fatal: e.data.fatal }); };
    worker.postMessage({ code, fn, cases: cases.map(c => ({ args: c.a, expected: c.e })) });
  });
}

// ---------- navigation ----------
const app = document.getElementById('app');
const WORK = ['learn', 'quiz', 'code'];
function go(v, nb) { if (!nb && S.view && S.view !== v) S.hist.push(S.view); S.view = v; render(); window.scrollTo(0, 0); }
function toDescent() { S.hist = ['heroes', 'char']; go('descent', true); }
function back() {
  if (S.view === 'code' && S.boss) { stopTimer(); S.boss = false; toDescent(); return; }
  if (['win', 'lose', 'lvl'].includes(S.view)) { toDescent(); return; }
  let p = S.hist.pop(); while (p && ['win', 'lose', 'lvl', 'bossintro'].includes(p)) p = S.hist.pop();
  go(p || 'title', true);
}
function bar(t) {
  const r = readiness(), x = P.hero ? P.hero.xp : 0;
  return `<div class="bar"><button onclick="back()">← Back</button><span style="flex:1">${t}</span><span id="tm">${S.boss ? '⧗ 45:00' : ''}</span><div class="mo" title="Readiness"><div style="height:${r / 3.75 * 100}%;background:#8e1b14"></div></div><div class="mo" title="Experience"><div style="height:${x / 3}%;background:#1f3a8a"></div></div></div>`;
}
function award(stepId, coding) {
  if (P.steps[stepId]) return false;
  const st = RUN.find(s => s.id === stepId); P.steps[stepId] = today();
  const h = P.hero; h.xp += st.type === 'boss' ? 150 : 30; h.coding += coding || 0;

  P.history.push({ step: stepId, date: today() }); save(); return true;
}

const LESSONS = [

    idea: { en: 'Walk once from the left, writing down the running total. Walk once from the right, doing the same. Now any range, or "everything except i", is a quick combination of two numbers you already have.', pt: 'Percorra uma vez da esquerda, anotando o total acumulado. Percorra uma vez da direita, fazendo o mesmo. Agora qualquer intervalo, ou "tudo menos i", é uma conta rápida com dois números que você já tem.' },
    code: 'def other_totals(counts):\n    n = len(counts)\n    left = [0] * n      # total before i\n    right = [0] * n     # total after i\n    for i in range(1, n):\n        left[i] = left[i-1] + counts[i-1]\n    for i in range(n-2, -1, -1):\n        right[i] = right[i+1] + counts[i+1]\n    return [left[i] + right[i] for i in range(n)]',

    traps: { en: ['Off by one: decide if left[i] includes position i, and stick to it.', 'Space: the two lists cost O(n) extra memory. Say it out loud.'], pt: ['Erro de um: decida se left[i] inclui a posição i, e mantenha.', 'Espaço: as duas listas custam O(n) de memória extra. Fale isso em voz alta.'] } },
  { name: { en: 'Running best', pt: 'Melhor acumulado' },
    when: { en: 'You need the best result over a run of consecutive items, or the best "buy before sell". Words to watch: consecutive, best window, maximum gain.', pt: 'Você precisa do melhor resultado numa sequência de itens consecutivos, ou do melhor "comprar antes de vender". Palavras para ficar de olho: consecutivo, melhor janela, ganho máximo.' },
    idea: { en: 'Walk once and keep two numbers: the best you can have ending right here, and the best you have seen so far. When continuing the run is worse than starting fresh, start fresh.', pt: 'Percorra uma vez guardando dois números: o melhor que dá para ter terminando aqui, e o melhor que você já viu. Quando continuar a sequência fica pior do que recomeçar, recomece.' },
    code: 'def best_window(net):\n    here = best = net[0]\n    for x in net[1:]:\n        here = max(x, here + x)   # extend or start fresh\n        best = max(best, here)\n    return best',
    trace: [['x', '-2', '1', '-3', '4', '-1', '2'], ['here', '-2', '1', '-2', '4', '3', '5'], ['best', '-2', '1', '1', '4', '4', '5']],

  { name: { en: 'In-place reversal', pt: 'Inversão no lugar' },

    idea: { en: 'Rotating right by k is three reversals: reverse everything, then reverse the first k, then reverse the rest. First reduce k with k % n, since rotating n times changes nothing.', pt: 'Girar k posições para a direita são três inversões: inverta tudo, depois os primeiros k, depois o resto. Antes, reduza k com k % n, porque girar n vezes não muda nada.' },

  let saved = null; try { saved = sessionStorage.getItem(codeKey()); } catch (e) {}
  const label = b ? 'Boss · ' + p.title : isPractice ? 'Practice before the rematch · ' + p.title : RUN.find(s => s.id === S.step).name;
  return bar('Floor III · ' + label) + `<div class="wk split"><div style="font-size:14px;line-height:1.6"><h3 style="margin:0 0 8px;font-size:16px">${p.title}</h3><p style="margin:0">${p.story}</p>${p.ex.map(e => `<div class="ex mono">${esc(fmtArgs(p, e.a))}\n→ ${esc(JSON.stringify(e.e))}</div>`).join('')}<p class="lb">${p.cons}</p>${b ? '<p class="lb" style="margin-top:10px">Boss rules: 45 minutes, no running code, write your approach before coding, then state the complexity.</p>' : ''}<p class="lb" style="margin-top:12px"><button class="wb" style="font-size:12px;padding:3px 8px" onclick="unfair()">⚑ This problem is unfair</button></p><p id="uf" class="lb" style="margin-top:4px"></p></div><div style="display:flex;flex-direction:column;gap:8px"><label class="lb" for="ap">Approach ${b ? '(required before coding)' : '(optional)'}</label><textarea id="ap" class="plain" rows="2" oninput="lock()" placeholder="Describe your plan in a sentence or two"></textarea><label class="lb" for="cd">Python · plain editor, no autocomplete${b ? '' : ' · print() works for debugging'}</label><textarea id="cd" class="code" rows="11" spellcheck="false" autocomplete="off" autocapitalize="off" oninput="try{sessionStorage.setItem(codeKey(),this.value)}catch(e){}" onkeydown="tabKey(event)">${esc(saved || p.sig)}</textarea><p id="lk" class="lb warnc"></p><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${b ? '' : '<button class="wb" id="runb" onclick="runSamples()">▶\ufe0e Run samples</button>'}<button class="wb" id="subb" onclick="submitCode()">Submit</button>${b ? '<button class="wb" style="margin-left:auto" onclick="giveUp()">Give up</button>' : ''}</div><div id="out" class="res" aria-live="polite"></div></div></div>`;
};
function tabKey(e) { if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); const t = e.target, s = t.selectionStart; t.value = t.value.slice(0, s) + '    ' + t.value.slice(t.selectionEnd); t.selectionStart = t.selectionEnd = s + 4; try { sessionStorage.setItem(codeKey(), t.value); } catch (er) {} } }
function lock() { if (!S.boss) return; const n = !document.getElementById('ap').value.trim(); document.getElementById('cd').disabled = n; document.getElementById('lk').textContent = n ? 'Write your approach first. The editor unlocks after.' : ''; }
function unfair() { document.getElementById('uf').textContent = 'Noted. In the full game an unfair problem leaves the pool, and a loss to it doesn\'t count.'; }
function busy(on, msg) { ['runb', 'subb'].forEach(id => { const b = document.getElementById(id); if (b) b.disabled = on; }); if (msg) document.getElementById('out').innerHTML = `<p class="lb">${msg}</p>`; }
function showResult(p, cases, r, title) {
  const out = document.getElementById('out');
  if (r.timeout) { out.innerHTML = '<p class="badc">Your code ran for more than 8 seconds and was stopped. Look for an infinite loop or a nested loop that is too slow.</p>'; return false; }
  if (r.fatal) { out.innerHTML = `<p class="badc">${esc(r.fatal)}</p>`; return false; }
  if (r.compile_error) { out.innerHTML = `<p class="badc">${esc(r.compile_error)}</p>`; return false; }
  const passed = r.cases.filter(c => c.ok).length;
  let h = `<p class="${passed === cases.length ? 'okc' : 'badc'}" style="margin:0">${title}: ${passed} of ${cases.length} passed</p>`;
  r.cases.forEach((c, i) => { if (!c.ok) h += `<div class="case"><span class="badc">✗ Failed</span>\ninput:    ${esc(fmtArgs(p, cases[i].a))}\nexpected: ${esc(JSON.stringify(cases[i].e))}\n${c.error ? 'error:    ' + esc(c.error) : 'yours:    ' + esc(c.got)}</div>`; });
  if (r.stdout) h += `<div class="case"><span class="lb">print output</span>\n${esc(r.stdout)}</div>`;
  out.innerHTML = h; return passed === cases.length;
}
async function runSamples() {
  const p = curProblem(); busy(true, worker ? 'Running…' : 'Loading Python for the first time, a few seconds…');
  const r = await runPy(document.getElementById('cd').value, p.fn, p.ex); busy(false); showResult(p, p.ex, r, 'Sample tests');
}
async function submitCode() {
  const p = curProblem(), code = document.getElementById('cd').value;
  if (code.trim() === p.sig.trim()) { document.getElementById('out').innerHTML = '<p class="badc">Write a solution first.</p>'; return; }
  if (S.boss && !document.getElementById('ap').value.trim()) { lock(); return; }
  const cases = p.ex.concat(p.hid);
  busy(true, worker ? 'Running the hidden tests…' : 'Loading Python for the first time, a few seconds…');
  if (S.boss) { P.bossSubs++; save(); }
  const r = await runPy(code, p.fn, cases); busy(false);
  if (!showResult(p, cases, r, 'All tests')) return;
  if (S.boss) { askComplexity(); return; }
  const out = document.getElementById('out');
  if (S.step === 'practice') { P.practiceDone = true; save(); out.innerHTML += '<p class="okc">Practice cleared. The guardian awaits your rematch.</p><button class="wb" onclick="go(\'bossintro\')">Face the guardian</button>'; return; }
  const first = award(S.step, 2);
  out.innerHTML += `<p class="okc">${first ? 'Step cleared. +30 XP, Coding +2.' : 'Solved again. This step was already cleared.'}</p><button class="wb" onclick="S.lvlUp?go('lvl'):toDescent()">Back to the descent</button>`;
}
function askComplexity() {
  const opts = ['O(1)', 'O(log n)', 'O(n)', 'O(n log n)', 'O(n²)'];
  document.getElementById('out').innerHTML += `<div class="case" style="font-family:inherit"><p style="margin:0 0 6px">All tests pass. Last step: what is the time complexity of your solution?</p>${opts.map(o => `<button class="wb" style="margin:3px" onclick="answerCx('${o}')">${o}</button>`).join('')}<p id="cxr" class="lb"></p></div>`;
}
function answerCx(o) {
  if (o !== curProblem().cx) { document.getElementById('cxr').innerHTML = '<span class="badc">That isn\'t the complexity of a good solution here. Count how many times you touch each item, then answer again.</span>'; return; }
  stopTimer(); S.boss = false; award('boss', 8); go('win');
}
function giveUp() { stopTimer(); S.boss = false; P.bossLost = true; P.practiceDone = false; P.hero.xp += 30; while (P.hero.xp >= 300) { P.hero.xp -= 300; P.hero.level++; } save(); go('lose'); }
function startTimer() { stopTimer(); S.deadline = Date.now() + 45 * 60 * 1000; S.timer = setInterval(tick, 1000); tick(); }
function stopTimer() { if (S.timer) clearInterval(S.timer); S.timer = null; }
function tick() { const ms = S.deadline - Date.now(), el = document.getElementById('tm'); if (ms <= 0) { giveUp(); return; } if (el) { const m = Math.floor(ms / 60000), s = Math.floor(ms / 1000) % 60; el.textContent = '⧗ ' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); } }
function fight() { S.step = 'boss'; S.boss = true; try { sessionStorage.removeItem('id-code:boss'); } catch (e) {} go('code'); startTimer(); }

// ---------- boss and result screens ----------
V.bossintro = () => `<div class="g" style="text-align:center"><p class="sm">Floor III · Arrays and strings</p><p class="big" style="color:#a8321f">The Arrays guardian</p><p class="sm" style="margin-bottom:14px">awaits in the dark</p><div class="pan" style="max-width:460px;margin:0 auto;text-align:left"><div class="kv"><span>Challenge</span><span>One unseen medium</span></div><div class="kv"><span>Time</span><span>45 minutes</span></div><div class="kv"><span>Run code</span><span style="color:#a8321f">Sealed</span></div><div class="kv"><span>Before coding</span><span>Write your approach</span></div><div class="kv"><span>To win</span><span>Hidden tests and complexity</span></div><div class="kv"><span>Submissions</span><span>Unlimited until time runs out</span></div></div><div style="margin-top:16px"><button class="btn red" onclick="fight()">Fight</button></div></div>`;
V.win = () => `<div class="g" style="text-align:center"><p class="big" style="color:#d8b25a;margin-top:20px">The Arrays guardian is slain</p><p class="sm" style="margin-bottom:14px">Floor III cleared · ${today()}</p><div class="pan" style="max-width:460px;margin:0 auto;text-align:left"><div class="kv"><span>Experience</span><span style="color:#6b8fd8">+150</span></div><div class="kv"><span>Coding</span><span>+8</span></div><div class="kv"><span>Google SWE intern</span><span style="color:#e05a4a">${readiness().toFixed(2)}%</span></div><div class="kv"><span>Boss submissions</span><span>${P.bossSubs}</span></div><div class="kv"><span>Ramp SWE intern</span><span style="color:#5a4d3a">uncharted</span></div></div><p class="sm" style="margin-top:12px">Your record now says: you know arrays, as of today.</p><p class="sm" style="font-family:system-ui;max-width:460px;margin:8px auto">That's the end of the demo. Tell us what you thought on Discord or in a Feedback issue on GitHub.</p><button class="btn" onclick="S.hist=['heroes'];go(S.lvlUp?'lvl':'char',true)">Continue</button></div>`;
V.lose = () => `<div class="g" style="text-align:center"><p class="big" style="color:#a8321f;margin-top:20px">You have fallen</p><p class="sm" style="margin-bottom:14px">The Arrays guardian still stands</p><div class="pan" style="max-width:460px;margin:0 auto;text-align:left"><div class="kv"><span>Experience for the attempt</span><span style="color:#6b8fd8">+30</span></div><div class="kv"><span>Readiness</span><span>unchanged</span></div></div><p class="sm" style="margin-top:12px">Return to town: one practice problem before you face it again.</p><button class="btn" onclick="S.step='practice';S.boss=false;go('code')">Go to practice</button></div>`;
V.final = () => `<div class="g" style="text-align:center"><p class="sm">Floor XVIII</p><p class="big" style="color:#a8321f">The full loop</p><p class="sm" style="color:#d8b25a;margin-bottom:14px">You approach unprepared</p><div class="pan" style="max-width:460px;margin:0 auto;text-align:left"><div class="kv"><span>Floors not cleared</span><span>${floorCleared() ? 16 : 17} of 17</span></div><div class="kv"><span>Readiness</span><span style="color:#e05a4a">${readiness().toFixed(2)}%</span></div></div><p class="sm" style="margin-top:12px">In the full game you can fight now, and it counts as a practice run. It isn't playable in the demo.</p></div>`;
V.lvl = () => `<div class="g" style="text-align:center;padding-top:50px"><p class="sm">Your experience grows</p><p class="big" style="color:#d8b25a;font-size:32px">Level ${P.hero.level}</p><p class="sm" style="margin-bottom:14px">${esc(P.hero.name)} · ${P.hero.cls}</p><div class="pan" style="max-width:420px;margin:0 auto;text-align:left"><p style="font-size:13px;margin:0 0 6px">No points to spend.</p><p style="font-size:12px;color:#a8957a;margin:0;font-family:system-ui;line-height:1.6">Your attributes only grow from challenges you pass. Your level shows how much work you've put in. Your readiness shows how close you are.</p></div><button class="btn" style="margin-top:14px" onclick="S.lvlUp=false;toDescent()">Continue</button></div>`;

function render() {
  if (!P.hero && !['title', 'cls', 'name'].includes(S.view)) S.view = 'title';
  document.body.classList.toggle('title-mode', S.view === 'title');
  const backBtn = S.view !== 'title' && !WORK.includes(S.view) ? '<button class="btn" style="margin-bottom:8px" onclick="back()">← Back</button>' : '';
  app.innerHTML = backBtn + V[S.view]();
  if (S.view === 'code') lock();
  bindNote();
}
render();
</script>
</body>
